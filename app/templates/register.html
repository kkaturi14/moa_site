{% extends "base.html" %}
{% block title %}회원가입 - {{ site_name }}{% endblock %}
{% block body %}
<div class="auth">
  <h2>회원가입</h2>
  <p class="sub">30초면 가입할 수 있어요</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>아이디</label><input type="text" name="username">
    <label>비밀번호</label><input type="password" name="password">
    <label>닉네임</label><input type="text" name="nickname">
    <label>이메일</label><input type="email" name="email">
    <div style="margin-top:20px"><button class="btn block lg" type="submit">가입하기</button></div>
  </form>
  <div class="foot">이미 계정이 있으신가요? <a href="/login">로그인</a></div>
</div>
{% endblock %}
