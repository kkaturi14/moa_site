{% extends "base.html" %}
{% block title %}서버 점검 - {{ site_name }}{% endblock %}
{% block body %}
<div class="sec-title">관리자 대시보드</div>
<div class="acct-tabs">
  <a href="/admin">회원/주문</a>
  <a class="active" href="/admin/tools">서버 점검</a>
</div>
<div class="panel">
  <h3 style="font-size:16px;margin-bottom:4px">네트워크 상태 확인</h3>
  <p class="sub">서버에서 대상 호스트로의 연결을 점검합니다</p>
  <form method="get" action="/admin/tools">
    <label>호스트 / IP</label><input type="text" name="host" value="{{ host }}" placeholder="예: 8.8.8.8">
    <div style="margin-top:12px"><button class="btn" type="submit">점검 실행</button></div>
  </form>
  {% if output %}
  <pre style="background:#1e1e24;color:#d4d4d8;padding:16px;border-radius:9px;margin-top:16px;font-size:13px;overflow:auto">{{ output }}</pre>
  {% endif %}
</div>
{% endblock %}
