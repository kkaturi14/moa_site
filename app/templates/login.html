{% extends "base.html" %}
{% block title %}로그인 - {{ site_name }}{% endblock %}
{% block body %}
<div class="auth">
  <h2>로그인</h2>
  <p class="sub">모아마켓에 오신 걸 환영해요</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>아이디</label>
    <input type="text" name="username" autofocus>
    <label>비밀번호</label>
    <input type="password" name="password">
    <div style="margin-top:20px"><button class="btn block lg" type="submit">로그인</button></div>
  </form>
  <div class="foot">아직 회원이 아니신가요? <a href="/register">회원가입</a></div>
</div>
{% endblock %}
