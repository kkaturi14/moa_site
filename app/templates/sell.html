{% extends "base.html" %}
{% block title %}판매하기 - {{ site_name }}{% endblock %}
{% block body %}
<div class="formpage">
  <h2>내 물건 팔기</h2>
  <p class="sub">사진과 설명을 올려 쉽게 판매하세요</p>
  <form method="post" enctype="multipart/form-data">
    <label>상품명</label><input type="text" name="title" required>
    <label>카테고리</label>
    <select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
    <label>가격 (원)</label><input type="number" name="price" value="0">
    <label>거래 지역</label><input type="text" name="location" placeholder="예: 서울 성북구">
    <label>상품 설명</label><textarea name="description" rows="6" placeholder="상품 상태를 자세히 적어주세요"></textarea>
    <label>상품 사진</label><input type="file" name="image">
    <div style="margin-top:20px"><button class="btn lg block" type="submit">등록하기</button></div>
  </form>
</div>
{% endblock %}
